<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 儀表板（戰情室／今天 AI 使用分析）</title>
<style>
  :root{
    --bg:#fcfcfb; --card:#fff; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --line:#e6e5e1; --accent:#2a78d6; --accent-bg:#e9f1fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111; --card:#1a1a1a; --ink:#f2f2f0; --ink-2:#b8b7b2; --ink-3:#898781;
      --line:#2c2c2a; --accent:#7fb0ef; --accent-bg:#17283d;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font:16px/1.55 -apple-system,"Noto Sans TC","PingFang TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100vh; height:100dvh;
  }
  .tab-bar{
    display:flex; background:var(--card); border-bottom:1px solid var(--line);
    flex:0 0 auto; position:sticky; top:0; z-index:40;
  }
  .tab-btn{
    flex:1 1 0; min-width:0; text-align:center; padding:13px 8px; font-size:14px;
    font-weight:600; color:var(--ink-3); background:transparent; border:0;
    border-bottom:3px solid transparent; cursor:pointer;
    font-family:-apple-system,"Noto Sans TC","PingFang TC",system-ui,sans-serif;
    min-height:44px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tab-btn.on{ color:var(--accent); border-bottom-color:var(--accent); background:var(--accent-bg); }
  .frame-wrap{ flex:1 1 auto; min-height:0; display:flex; }
  .hub-frame{ flex:1 1 auto; width:100%; height:100%; border:0; display:block; background:var(--card); }
  .hub-frame[hidden]{ display:none; }
</style>
</head>
<body>
<div class="tab-bar" role="tablist" aria-label="頁籤">
  <button type="button" class="tab-btn" id="tabBtnProof" data-tab="proof" role="tab">今天 AI 使用分析</button>
  <button type="button" class="tab-btn" id="tabBtnWarroom" data-tab="warroom" role="tab">戰情室</button>
</div>
<div class="frame-wrap">
  <iframe id="frameProof" class="hub-frame" title="今天 AI 使用分析"></iframe>
  <iframe id="frameWarroom" class="hub-frame" title="戰情室" hidden></iframe>
</div>
<script>
(function(){
  try{
    var TABS = {
      proof:   { btn: document.getElementById('tabBtnProof'),   frame: document.getElementById('frameProof'),   url: 'proof_v3_viz5c.html' },
      warroom: { btn: document.getElementById('tabBtnWarroom'), frame: document.getElementById('frameWarroom'), url: 'https://daniel-reports.vercel.app/warroom.html' }
    };
    var loaded = {};

    function activate(key){
      if(!TABS[key]) key = 'proof';
      Object.keys(TABS).forEach(function(k){
        var t = TABS[k];
        var on = (k === key);
        t.btn.classList.toggle('on', on);
        t.btn.setAttribute('aria-selected', on ? 'true' : 'false');
        t.frame.hidden = !on;
        if(on && !loaded[k]){
          t.frame.src = t.url;
          loaded[k] = true;
        }
      });
      try{
        if(location.hash !== '#' + key) location.hash = key;
      }catch(e){}
    }

    Object.keys(TABS).forEach(function(k){
      TABS[k].btn.addEventListener('click', function(){ activate(k); });
    });

    var initial = 'proof';
    try{
      var h = (location.hash || '').replace('#', '');
      if(h && TABS[h]) initial = h;
    }catch(e){}
    activate(initial);

    window.addEventListener('hashchange', function(){
      try{
        var h = (location.hash || '').replace('#', '');
        if(h && TABS[h]) activate(h);
      }catch(e){}
    });
  }catch(e){
    console.error('hub_tabs_b init failed', e);
  }
})();
</script>
</body>
</html>
