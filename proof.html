<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 每天做了什麼</title>
<style>
  :root{
    color-scheme: light;
    --bg:#fcfcfb;
    --card:#ffffff;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-3:#8a8985;
    --line:#e6e5e1;
    --accent:#2a78d6;
    --accent-bg:#e9f1fb;
    --alert:#d03b3b;
    --alert-bg:#fbeaea;
    --pill-off-bg:#f0efeb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#1a1a19;
      --card:#232322;
      --ink:#ffffff;
      --ink-2:#c3c2b7;
      --ink-3:#8d8c85;
      --line:#3a3a38;
      --accent:#3987e5;
      --accent-bg:#1c2b3f;
      --alert:#e66767;
      --alert-bg:#3a2222;
      --pill-off-bg:#2d2d2b;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#1a1a19; --card:#232322; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8d8c85;
    --line:#3a3a38; --accent:#3987e5; --accent-bg:#1c2b3f; --alert:#e66767; --alert-bg:#3a2222;
    --pill-off-bg:#2d2d2b;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size:15.5px; line-height:1.6;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  .wrap{ max-width:680px; margin:0 auto; padding:24px 16px 56px; }

  /* ---- 頂部 ---- */
  h1{ font-size:22px; font-weight:700; margin:0 0 8px; letter-spacing:.01em; }
  .lede{ margin:0 0 6px; color:var(--ink-2); }
  .updated{ margin:0 0 22px; font-size:13px; color:var(--ink-3); }

  /* ---- 每天一段 ---- */
  details.day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    margin:0 0 10px;
    overflow:hidden;
  }
  details.day summary{
    list-style:none;
    cursor:pointer;
    padding:14px 14px 14px 16px;
    display:flex; align-items:flex-start; gap:10px;
    font-size:17px; font-weight:600; line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  details.day summary::-webkit-details-marker{ display:none; }
  details.day summary:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:12px; }
  .sum-body{ flex:1; min-width:0; }
  .sum-date{ display:block; }
  .sum-stats{ display:flex; flex-wrap:wrap; column-gap:.4em; row-gap:2px; font-weight:500; font-size:15px; color:var(--ink-2); margin-top:2px; }
  .sum-stats .chunk{ white-space:nowrap; }
  .sum-stats .chunk + .chunk::before{ content:'·'; color:var(--ink-3); margin-right:.4em; }
  .sum-stats .chunk.burn{ flex-basis:100%; }
  .sum-stats .chunk.burn::before{ content:none; }
  @media (min-width:600px){
    .sum-stats .chunk.burn{ flex-basis:auto; }
    .sum-stats .chunk.burn::before{ content:'·'; }
  }
  .sum-stats .n{ color:var(--ink); font-weight:600; }
  .sum-stats .alert{ color:var(--alert); font-weight:700; }
  .chev{
    flex:none; width:20px; height:20px; margin-top:4px;
    color:var(--ink-3); transition:transform .18s ease;
  }
  details[open] .chev{ transform:rotate(180deg); }

  .day-body{ padding:0 16px 14px; border-top:1px solid var(--line); }

  /* ---- 事項清單 ---- */
  ul.items{ list-style:none; margin:0; padding:6px 0 0; }
  li.item{
    display:grid;
    grid-template-columns:22px 1fr auto;
    column-gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  li.item:last-child{ border-bottom:none; }
  li.item.unverified{ opacity:.55; }
  .k{ width:22px; height:22px; margin-top:2px; color:var(--ink-2); }
  .k svg{ width:22px; height:22px; display:block; }
  .txt{ min-width:0; }
  .txt .t{ display:block; overflow-wrap:anywhere; }
  .time{ font-size:12.5px; color:var(--ink-3); padding-top:3px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pill{
    display:inline-block; margin-top:6px;
    font-size:12.5px; line-height:1.3; padding:3px 9px; border-radius:999px;
    text-decoration:none; font-weight:500;
  }
  .pill.link{ background:var(--accent-bg); color:var(--accent); }
  .pill.link:hover{ text-decoration:underline; }
  .pill.off{ background:var(--pill-off-bg); color:var(--ink-3); }
  .pill.warn{ background:var(--alert-bg); color:var(--alert); }
  .empty{ padding:12px 0 6px; color:var(--ink-3); }
  .fallback-tag{ font-size:12.5px; color:var(--ink-3); padding:8px 0 0; }

  .detail{ margin:12px 0 0; font-size:13px; color:var(--ink-3); line-height:1.6; }
  .notes{ margin:6px 0 0; font-size:14px; color:var(--ink-2); }

  /* ---- 小結 ---- */
  .sum14{ margin:22px 0 0; padding:14px 0 0; border-top:1px solid var(--line); font-size:14.5px; color:var(--ink-2); }
  .sum14 .n{ color:var(--ink); font-weight:600; }
  .sum14 .sep{ color:var(--ink-3); margin:0 .35em; }

  .msg{ padding:24px 16px; text-align:center; color:var(--ink-2); background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .foot{ margin:28px 0 0; font-size:12.5px; color:var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 每天做了什麼</h1>
    <p class="lede">每一件都附證據，點得開才算；沒證據的會標「未驗證」。數字是程式算的，不是我填的。</p>
    <p class="updated" id="updated">讀取中…</p>
  </header>

  <main id="days"></main>
  <section class="sum14" id="sum14" hidden></section>
  <p class="foot">資料來源：<code>proof.json</code>（由 proof_table.py 每日產生）。「萬」＝萬個 token；「每 100 萬額度」＝完成件數 ÷（當天燒掉的萬 ÷ 100）。</p>
</div>

<script>
(function(){
  const q = new URLSearchParams(location.search);
  const SRC = q.get('data') || 'proof.json';
  const WD = ['日','一','二','三','四','五','六'];
  const ICON = {
    commit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v6.5M12 15.5V22"/></svg>',
    ticket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.5a2 2 0 0 0 0 5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5a2 2 0 0 0 0-5z"/><path d="M13 5v14" stroke-dasharray="2 2.5"/></svg>',
    note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>'
  };
  const KIND_LABEL = {commit:'程式修改', ticket:'看板票', note:'日誌'};

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (v, d=0) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d).replace(/\.0+$/,'') : null;
  const wan = v => { const n = num(v,1); return n === null ? '—' : n; };
  const per100 = (done, w) => (typeof done === 'number' && typeof w === 'number' && w > 0) ? (done / (w/100)) : null;
  const fmtPer = v => v === null ? '—' : (v >= 10 ? Math.round(v) : v.toFixed(1)).toString();

  function fmtDate(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if(!m) return esc(s || '?');
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    return `${+m[2]}/${+m[3]}（${WD[d.getDay()]}）`;
  }
  function todayStr(){
    const d = new Date(); const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function fmtUpdated(s){
    const d = new Date(s); if(isNaN(d)) return s ? esc(s) : '—';
    const p = n => String(n).padStart(2,'0');
    return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function scoreHtml(day){
    const s = num(day.score_avg, 1);
    if(s === null) return `<span class="chunk">你打 <span class="n">—</span></span>`;
    const bad = day.score_avg <= 2;
    return `<span class="chunk">你打 <span class="${bad?'alert':'n'}">${s} 分</span></span>`;
  }

  function summaryHtml(day, done, burn){
    return `<span class="sum-date">${fmtDate(day.date)}</span>`
      + `<span class="sum-stats">`
      + `<span class="chunk">完成 <span class="n">${done === null ? '—' : done}</span> 件</span>`
      + `<span class="chunk">回你 <span class="n">${num(day.discord_replies) ?? '—'}</span> 則</span>`
      + scoreHtml(day)
      + `<span class="chunk burn">燒 <span class="n">${wan(burn)}</span> 萬 → 每 100 萬額度 <span class="n">${fmtPer(per100(done, burn))}</span> 件</span>`
      + `</span>`;
  }

  function itemHtml(it){
    const kind = ICON[it.kind] ? it.kind : 'note';
    const unv = it.verified === false;
    let pill;
    if(unv){
      pill = `<span class="pill warn">未驗證${it.evidence_label ? '・'+esc(it.evidence_label) : ''}</span>`;
    } else if(it.evidence_url){
      pill = `<a class="pill link" href="${esc(it.evidence_url)}" target="_blank" rel="noopener">${esc(it.evidence_label || '證據')} ↗</a>`;
    } else {
      pill = `<span class="pill off" title="沒有可點的連結">${esc(it.evidence_label || '無連結')}</span>`;
    }
    return `<li class="item${unv?' unverified':''}">`
      + `<span class="k" title="${KIND_LABEL[kind]}" aria-label="${KIND_LABEL[kind]}">${ICON[kind]}</span>`
      + `<div class="txt"><span class="t">${esc(it.text || '（沒有描述）')}</span>${pill}</div>`
      + `<span class="time">${esc(it.time || '')}</span>`
      + `</li>`;
  }

  function dayHtml(day, open){
    const items = Array.isArray(day.items) ? day.items : null;
    const hl = Array.isArray(day.highlights) ? day.highlights : [];
    const burn = (day.tokens_main_wan || 0) + (day.tokens_sub_wan || 0);
    let done, list;

    if(items){
      done = items.filter(i => i.verified !== false).length;
      list = items.length
        ? `<ul class="items">${items.map(itemHtml).join('')}</ul>`
        : `<p class="empty">這天沒有可驗證的產出</p>`;
    } else {
      // 舊資料：沒有 items，退回顯示 highlights（完成件數顯示 —）
      done = null;
      list = hl.length
        ? `<p class="fallback-tag">舊格式資料，只有摘要、沒逐件證據：</p>`
          + `<ul class="items">${hl.map(h => itemHtml({kind:'note', text:h, evidence_url:null, evidence_label:'日誌摘要', verified:false})).join('')}</ul>`
        : `<p class="empty">這天沒有可驗證的產出</p>`;
    }

    const n = v => num(v) ?? '—';
    const detail = `詳細：commit ${n(day.commits)}・票 送驗 ${n(day.tickets_verify)}／關單 ${n(day.tickets_done)}・分身 ${n(day.subagent_runs)} 支・主線 ${wan(day.tokens_main_wan)} 萬／分身 ${wan(day.tokens_sub_wan)} 萬・新糾正票 ${n(day.corrections_new)}`;
    const notes = day.notes ? `<p class="notes">${esc(day.notes)}</p>` : '';

    return `<details class="day"${open?' open':''}>`
      + `<summary><div class="sum-body">${summaryHtml(day, done, burn)}</div>`
      + `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>`
      + `<div class="day-body">${list}<p class="detail">${detail}</p>${notes}</div>`
      + `</details>`;
  }

  function render(data){
    const days = (Array.isArray(data.days) ? data.days.slice() : []).sort((a,b) => (a.date < b.date ? 1 : -1));
    document.getElementById('updated').textContent = '最近更新 ' + fmtUpdated(data.generated_at);
    const root = document.getElementById('days');
    if(!days.length){ root.innerHTML = '<div class="msg">還沒有任何一天的資料</div>'; return; }

    const today = todayStr();
    const openDate = days.some(d => d.date === today) ? today : days[0].date;
    root.innerHTML = days.map(d => dayHtml(d, d.date === openDate)).join('');

    // 14 天小結
    const recent = days.slice(0, 14);
    let done = 0, burn = 0, scoreSum = 0, scoreN = 0;
    recent.forEach(d => {
      if(Array.isArray(d.items)) done += d.items.filter(i => i.verified !== false).length;
      burn += (d.tokens_main_wan || 0) + (d.tokens_sub_wan || 0);
      if(typeof d.score_avg === 'number' && isFinite(d.score_avg)){ scoreSum += d.score_avg; scoreN++; }
    });
    const sep = '<span class="sep">·</span>';
    const avg = scoreN ? (scoreSum/scoreN).toFixed(1) : '—';
    const s14 = document.getElementById('sum14');
    s14.hidden = false;
    s14.innerHTML = `這 ${recent.length} 天：完成共 <span class="n">${done}</span> 件${sep}額度共 <span class="n">${wan(burn)}</span> 萬${sep}每 100 萬額度 <span class="n">${fmtPer(per100(done, burn))}</span> 件${sep}你打分平均 <span class="n">${avg}</span>`;
  }

  fetch(SRC, {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById('updated').textContent = '';
      document.getElementById('days').innerHTML = '<div class="msg">資料檔還沒生出來</div>';
    });
})();
</script>
</body>
</html>
